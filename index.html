<style>
/* VOICE: loud, cheerful family game night
   IDEA: a TV game-show scoreboard hung over the harvest table
   PICTURE: the live question card with a big countdown ring
   COLOUR and TYPE: cranberry field, squash and gold accents; Bungee display + Rubik
   LAYOUT: sticky scoreboard band on top, one centred game column */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#1a0e10);--ink:light-dark(#2a1215,#f8ece6);--soft:light-dark(#f6ece8,#2a181b);--line:light-dark(#e6d3cc,#4a2d31);--muted:light-dark(#6e5357,#c9aeb2);--acc:light-dark(#8c1c2e,#ff9aa8);--cran:#8c1c2e;--squash:#e07a1f;--gold:#f2b632}

*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Rubik,system-ui,sans-serif;overflow-x:clip}
.top{position:sticky;top:0;z-index:5;background:var(--cran);color:#fff;padding:10px max(4vw,12px) 12px;box-shadow:0 4px 14px #0005}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font:19px/1.1 Bungee,sans-serif}
.qc{font-weight:700;color:var(--gold);font-size:15px}
.board{display:flex;gap:8px;overflow-x:auto;padding-top:10px;scrollbar-width:thin}
.chip{flex:none;display:flex;align-items:center;gap:8px;background:#ffffff1c;border-radius:999px;padding:5px 14px 5px 5px;white-space:nowrap}
.chip .rk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#ffffff2e;font-weight:700;font-size:13px}
.chip.first .rk{background:var(--gold);color:#3a1a00}
.chip .sc{font:17px Bungee,sans-serif;color:var(--gold)}
.chip.me{box-shadow:inset 0 0 0 2px var(--gold)}
.chip .st{font-size:14px}
.chip.off{opacity:.55}
.avi{width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;background:var(--soft);flex:none;display:inline-block}
.chip .avi{width:28px;height:28px;background:#ffffff2e}
.avi.lg{width:96px;height:96px;margin-bottom:8px;box-shadow:0 0 0 4px var(--gold)}
.avi.md{width:72px;height:72px}
.picrow{display:flex;align-items:center;gap:16px;margin:6px 0 10px;flex-wrap:wrap}
.filebtn{display:inline-flex;align-items:center;margin:0;line-height:48px}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.avs{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin:6px 0 4px}
.av{height:52px;border:2px solid var(--line);border-radius:14px;background:var(--bg);cursor:pointer;padding:3px;display:grid;place-items:center}
.av img{width:42px;height:42px;border-radius:50%}
.av.on{border-color:var(--gold);background:var(--soft);box-shadow:0 0 0 3px var(--gold)}
.av:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.empty{opacity:.85;font-size:14px;padding:6px 2px}
main{max-width:760px;margin:0 auto;padding:clamp(20px,4vw,44px) max(4vw,16px) 64px}
h1,h2{font-family:Bungee,sans-serif;font-weight:400;line-height:1.08;text-wrap:balance;margin:0 0 12px;color:var(--acc)}
h1{font-size:clamp(30px,6vw,46px)}h2{font-size:clamp(22px,4vw,30px)}
p{margin:0 0 14px}.muted{color:var(--muted)}
.card{background:var(--soft);border-radius:22px;padding:clamp(18px,3vw,28px);margin-bottom:18px}
.qhead{display:flex;align-items:center;gap:18px;margin-bottom:18px}
.qtext{font-size:clamp(20px,3.4vw,27px);font-weight:700;line-height:1.25;text-wrap:balance}
.ring{flex:none;width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:30px Bungee,sans-serif}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{display:flex;gap:12px;align-items:center;min-height:68px;border:0;border-radius:16px;color:#fff;font:500 18px/1.25 Rubik,sans-serif;text-align:left;padding:12px 16px;cursor:pointer;transition:transform .12s,opacity .2s}
.opt:not(:disabled):hover{transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt i{font:normal 16px Bungee,sans-serif;width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;background:#ffffff33}
.opt.dim{opacity:.32}.opt.pick,.opt.right{box-shadow:0 0 0 4px var(--gold)}
.opt.right i{background:var(--gold);color:#3a1a00}
.msg{margin-top:16px;font-weight:700;font-size:18px;text-align:center}
.big{font:clamp(40px,9vw,64px)/1 Bungee,sans-serif;color:var(--squash);text-align:center;margin:6px 0 10px}
.btn{min-height:48px;padding:0 22px;border-radius:14px;border:0;background:var(--squash);color:#fff;font:700 17px Rubik,sans-serif;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,textarea{font:16px Rubik,sans-serif;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
input{min-height:52px;font-size:19px}
textarea{min-height:220px;font-size:14px;line-height:1.5}
label{display:block;font-weight:700;margin-bottom:6px}

.tag.ok{background:#2f7a3a;color:#fff}.tag.no{background:var(--cran);color:#fff}
.x{background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;min-height:36px;text-decoration:underline}
details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.small{font-size:14px}
@media(max-width:520px){.opts{grid-template-columns:minmax(0,1fr)}.ring{width:76px;height:76px}.ring b{font-size:24px}.qhead{gap:12px}}
@media(prefers-reduced-motion:reduce){.opt{transition:none}}

/* turkeys, leaves, shimmer */
main{position:relative;z-index:1}
.brand{background:linear-gradient(90deg,#fff 0%,#fff 35%,var(--gold) 50%,#fff 65%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3.5s linear infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:-150% 0}}
.leaves{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.leaf{position:absolute;top:-40px;width:28px;height:28px;opacity:.5;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(var(--r))}}
.stage{position:relative;z-index:1;max-width:760px;height:230px;margin:0 auto 48px;overflow-x:clip;overflow-y:visible}
.ground{position:absolute;left:0;right:0;bottom:0;height:26px;border-radius:14px;background:repeating-linear-gradient(100deg,#d9a441 0 12px,#c48a2c 12px 24px)}
.tk{position:absolute;bottom:16px;width:110px;transition:left 3s linear}
.tk svg{width:110px;height:110px;display:block;transition:transform .3s}
.t1{left:-30%}.t2{left:68%}
.t2 svg{transform:scaleX(-1)}
.t1.flip svg{transform:scaleX(-1)}
.leg1,.leg2{transform-box:fill-box;transform-origin:50% 0}
.walk svg{animation:bob .4s ease-in-out infinite}
.walk .leg1{animation:swing .4s ease-in-out infinite}.walk .leg2{animation:swing .4s ease-in-out infinite reverse}
.laugh svg{animation:hop .35s ease-in-out 4}
@keyframes bob{50%{translate:0 -5px}}
@keyframes swing{0%,100%{rotate:-20deg}50%{rotate:20deg}}
@keyframes hop{50%{translate:0 -14px}}
.bubble{position:absolute;bottom:116px;left:6px;width:max-content;max-width:min(300px,58vw);background:#fff;color:#2a1215;border:3px solid var(--cran);border-radius:16px;padding:8px 12px;font:700 16px/1.3 Rubik,sans-serif;opacity:0;transform:scale(.6);transform-origin:bottom left;transition:opacity .25s,transform .25s}
.t2 .bubble{left:auto;right:6px;transform-origin:bottom right}
.bubble::after{content:'';position:absolute;bottom:-17px;left:24px;border:8px solid transparent;border-top-color:var(--cran)}
.t2 .bubble::after{left:auto;right:24px}
.bubble.show{opacity:1;transform:scale(1)}
@media(max-width:520px){.tk,.tk svg{width:84px;height:84px}.bubble{bottom:90px;font-size:15px}.stage{height:200px}}
@media(prefers-reduced-motion:reduce){.leaves{display:none}.tk{transition:none}.walk svg,.walk .leg1,.walk .leg2,.laugh svg,.brand{animation:none}}
.splash{position:fixed;inset:0;z-index:20;display:grid;place-items:center;overflow:auto;padding:24px 16px;background:radial-gradient(circle at 50% 28%,light-dark(#fff3e2,#33181d),var(--bg) 70%)}
.splash[hidden]{display:none}
.splin{width:min(760px,100%);text-align:center}
.sptitle{font-size:clamp(38px,8vw,76px);line-height:1;margin:0 0 10px;color:var(--acc);text-shadow:0 4px 0 light-dark(#f2b63266,#00000066);animation:drop .7s cubic-bezier(.2,1.4,.5,1) both}
.spsub{font-size:18px;color:var(--muted);margin:0 auto 6px;max-width:34em}
.splash .stage{margin:0 auto 18px}
.gobtn{font-size:22px;min-height:62px;padding:0 44px;border-radius:18px;box-shadow:0 6px 0 #a4520f;animation:pulse 1.6s ease-in-out infinite}
.gobtn:active{translate:0 4px;box-shadow:0 2px 0 #a4520f}
@keyframes drop{from{transform:translateY(-60px) scale(.8);opacity:0}}
@keyframes pulse{50%{scale:1.06}}
body.splash-on{overflow:hidden}
body.splash-on .leaves{z-index:21}
@media(prefers-reduced-motion:reduce){.sptitle,.gobtn{animation:none}}
.clue{background:light-dark(#fff6dc,#3a2a12);border:2px dashed var(--squash);border-radius:14px;padding:12px 16px;margin:0 0 14px}.clue p{margin:6px 0 0}.clue .cl{font-size:20px;font-weight:700}

function ranked(ps){let r=0,prev=null;return ps.map((p,i)=>{if(p.score!==prev){r=i+1;prev=p.score}return {...p,rank:r}})}
function renderBoard(){
  const b=$('#board'),ps=playersArr();
  if(!ps.length){b.innerHTML='<div class="empty">Scores appear here once players join.</div>';return}
  const res=S&&S.phase==='reveal'&&S.results||{};
  b.innerHTML=ranked(ps).map(p=>{
    let st='';
    if(isHost&&S&&S.phase==='q'&&(p.pid in ANS))st='<span class="st" title="Answered">✓</span>';
    if(S&&S.phase==='reveal'&&res[p.pid]===S.correct)st='<span class="st">+'+PTS+'</span>';
    return '<div class="chip'+(p.rank===1&&p.score>0?' first':'')+(p.pid===uid?' me':'')+(!p.on?' off':'')+'"><span class="rk">'+p.rank+'</span>'+avImg(p.pid,p.av)+'<span>'+esc(p.name)+'</span><span class="sc">'+p.score+'</span>'+st+'</div>'}).join('');
}
function ringHTML(){return '<div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--line)" stroke-width="10"/><circle id="arc" cx="50" cy="50" r="44" fill="none" stroke="var(--squash)" stroke-width="10" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><b id="secs">20</b></div>'}
function optsHTML(opts,o){o=o||{};return '<div class="opts">'+opts.map((t,i)=>{
  let cls='opt';if(o.correct!=null){cls+=i===o.correct?' right':' dim'}else if(o.pick!=null){cls+=i===o.pick?' pick':' dim'}
  return '<button class="'+cls+'" data-c="'+i+'" style="background:'+COLORS[i%4]+'"'+(o.disabled?' disabled':'')+'><i>'+LET[i]+'</i><span>'+esc(t)+'</span></button>'}).join('')+'</div>'}
function drawTimer(ms){const arc=$('#arc'),s=$('#secs');if(!arc||!s)return;const f=Math.max(0,Math.min(1,ms/(S&&+S.dur||QMS)));arc.setAttribute('stroke-dashoffset',String(276.5*(1-f)));arc.setAttribute('stroke',ms<5000?'#d8343f':'var(--squash)');s.textContent=String(Math.ceil(Math.max(0,ms)/1000))}
function setQC(){$('#qc').textContent=S&&(S.phase==='q'||S.phase==='reveal')?'Question '+((+S.qi||0)+1)+' of '+(+S.total||0):(isHost?'Host':'')}
function clueHTML(q,pid,host){if(!q||!q.team)return '';const c=q.cl&&q.cl[pid];return '<div class="clue"><b>🔍 Team clue question</b>'+(c?'<p>Your secret clue:</p><p class="cl">'+esc(c).replace(/\n/g,'<br>')+'</p><p class="small">Other players have different clues. Share yours out loud and ask for theirs!</p>':'<p>'+(host?'Every phone has a different secret clue. Players have to talk to each other to solve it!':'You joined after the clues were handed out, so ask everyone else for theirs!')+'</p>')+'</div>'}
function curQ(){return S&&S.q&&Array.isArray(S.q.opts)?S.q:null}
let pending=false;
function busy(){const a=document.activeElement;return !!(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT'&&a.type!=='file')&&$('#main').contains(a))}
function render(){
  setQC();renderBoard();

  const keep={};['nm','hn','qt'].forEach(id=>{const el=document.getElementById(id);if(el)keep[id]=el.value});const d=$('main details'),open=d&&d.open;

document.addEventListener('focusout',()=>setTimeout(()=>{if(pending&&!busy()){pending=false;lastKey='';renderIfChanged()}},0));
let lastKey='';
function renderIfChanged(force){const k=JSON.stringify([S&&S.g,S&&S.phase,S&&S.qi,me.joined,isHost?[Object.keys(ANS).length,hostPlays(),playersArr().map(p=>p.pid+p.on).join()]:0]);if(force||k!==lastKey){lastKey=k;render()}else{setQC();renderBoard()}}

/* ---------- HOST ---------- */
let QS=[],qText=LS.get('tg_qtext2',toText(DEFAULT)),revealing=false;
{const d=toText(DEFAULT),base=LS.get('tg_qbase2',null);if(qText!==d&&(base==null?false:qText===base)){qText=d;LS.set('tg_qtext2',d)}LS.set('tg_qbase2',qText===d?d:base)}
QS=parseQs(qText);if(!QS.length){qText=toText(DEFAULT);QS=parseQs(qText)}
const roundId=()=>S.g+'_'+S.qi;
function newG(){return Date.now().toString(36)}
function perm(seed,n){let h=2166136261;for(const ch of seed){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)>>>0}const a=[...Array(n).keys()];for(let k=n-1;k>0;k--){h=Math.imul(h^(h>>>15),2246822519)>>>0;const j=h%(k+1);[a[k],a[j]]=[a[j],a[k]]}return a}
function shuffled(g,i){const q=QS[i],n=q.opts.length,o=q.last?perm(g+'_'+i,n-1).concat([n-1]):perm(g+'_'+i,n);return {text:q.text,opts:o.map(k=>q.opts[k]),ans:o.indexOf(q.ans),clues:q.clues}}
function dealClues(clues,seed){const ids=playersArr().filter(p=>p.on).map(p=>p.pid).sort(),n=ids.length,k=clues.length,cl={};if(!n)return cl;const o=perm(seed,n);
  for(let j=0;j<Math.max(n,k);j++){const pid=ids[o[j%n]],c=clues[j%k];if(!cl[pid])cl[pid]=[];if(!cl[pid].includes(c))cl[pid].push(c)}
  for(const pid in cl)cl[pid]=cl[pid].join('\n');return cl}
async function askQ(i,extra){const q=shuffled(S.g,i),has=!!(q.clues&&q.clues.length),dur=has?CLUEMS:QMS,qq={text:q.text,opts:q.opts};if(has){qq.team=true;qq.cl=dealClues(q.clues,'clue_'+S.g+'_'+i)}const up=Object.assign({'state':{g:S.g,phase:'q',qi:i,total:QS.length,q:qq,dur,endsAt:now()+dur}},extra||{});await G('').update(up)}
function orderQS(g){const base=parseQs(qText),reg=base.filter(q=>!q.clues),team=base.filter(q=>q.clues),r=perm('order_'+g,reg.length).map(k=>reg[k]),t=perm('team_'+g,team.length).map(k=>team[k]);
  if(!t.length||!r.length){QS=r.concat(t);return}const out=[],gap=r.length/t.length,j=perm('gap_'+g,t.length);let ri=0;
  t.forEach((q,i)=>{const at=Math.min(r.length,Math.floor(gap*i+(j[i]%Math.max(1,Math.floor(gap)))+1));while(ri<at)out.push(r[ri++]);out.push(q)});while(ri<r.length)out.push(r[ri++]);QS=out}
async function startGame(){QS=parseQs(qText);if(!QS.length)return;const g0=newG();orderQS(g0);const up={answers:null};for(const pid of Object.keys(PL))up['players/'+pid+'/score']=0;S={g:g0};await askQ(0,up)}
async function reveal(){
  if(!S||S.phase!=='q'||revealing)return;revealing=true;
  try{
    const snap=await G('answers/'+roundId()).get();const a=snap.val()||{};const q=shuffled(S.g,S.qi);const up={};const results={};
    for(const[pid,c]of Object.entries(a)){if(!PL[pid])continue;results[pid]=c;if(c===q.ans)up['players/'+pid+'/score']=(+PL[pid].score||0)+PTS}
    up['state/phase']='reveal';up['state/correct']=q.ans;up['state/results']=results;
    await G('').update(up);
  }finally{revealing=false}
}
async function nextQ(){if(S.qi+1>=QS.length)await G('state').update({phase:'final',q:null,correct:null,results:null});else await askQ(S.qi+1,{answers:null})}
async function endGame(){await G('state').update({phase:'final',q:null,correct:null,results:null})}
async function toLobby(clearPlayers){const up={state:{g:newG(),phase:'lobby',qi:-1,total:QS.length},answers:null};if(clearPlayers){up.players=null;up.pics=null}else for(const pid of Object.keys(PL))up['players/'+pid+'/score']=0;await G('').update(up)}
function hostPlays(){return !!(me.joined&&PL[uid]&&PL[uid].name)}

/* ---------- PLAYER ---------- */

async function join(name){const av=Number.isInteger(selAv)?selAv:0;me={name,av,joined:true};LS.set('tg_me',me);await G('players/'+uid).update({name,av,on:true});if(selPic)await G('pics/'+uid).set(selPic);else await G('pics/'+uid).remove();G('players/'+uid+'/on').onDisconnect().set(false)}

function fail(t){$('#main').innerHTML='<div class="card"><h2>Can\'t start the game</h2><p>'+esc(t)+'</p></div>'}
(async()=>{
  if(!window.firebase)return fail('Firebase didn\'t load. Check your internet connection and reload.');

  catch(e){return fail('Couldn\'t connect to Firebase: '+(e&&e.message||e)+'. Make sure Anonymous sign-in is turned on.')}
  db.ref('.info/serverTimeOffset').on('value',s=>{offset=+s.val()||0});
  if(wantHost){
    const hs=await G('host').get();
    if(!hs.exists()){try{await G('host').set(uid)}catch(e){}}
    const h2=await G('host').get();isHost=h2.val()===uid;

    const st=await G('state').get();if(!st.exists())await G('state').set({g:newG(),phase:'lobby',qi:-1,total:QS.length});
    G('state').on('value',s=>{S=s.val();if(S&&S.g&&S.phase!=='lobby')orderQS(S.g);if(S&&S.phase==='q'){if(!QS[S.qi]||QS[S.qi].text!==(S.q&&S.q.text)){toLobby(false);return}}watchAnswers();renderIfChanged()});
  }else{

    db.ref('.info/connected').on('value',s=>{if(s.val()===true&&me.joined){const r=G('players/'+uid+'/on');r.onDisconnect().set(false);G('players/'+uid).once('value').then(p=>{if(p.val()&&p.val().name)r.set(true)})}});
  }

/* ---------- turkeys + leaves ---------- */
const JOKES=[
["Why did the turkey cross the road?","Why?","It was the chicken's day off!"],
["Why did the turkey join the band?","Why?","Because it had the drumsticks!"],
["What do you call a turkey that runs really fast?","What?","Fast food!"],

];
{
  const st=$('#stage'),t1=$('#t1'),t2=$('#t2'),b1=$('#b1'),b2=$('#b2');let ji=Math.floor(Math.random()*JOKES.length);
  const say=(b,txt,ms)=>{b.textContent=txt;b.classList.add('show');setTimeout(()=>b.classList.remove('show'),ms)};
  const at=(ms,fn)=>setTimeout(fn,ms);
  function scene(){
    if($('#splash').hidden)return;
    const[a,b,c]=JOKES[ji++%JOKES.length];
    t1.classList.remove('flip');t1.classList.add('walk');t1.style.left='24%';
    at(3000,()=>{t1.classList.remove('walk');say(b1,a,3300)});
    at(6500,()=>say(b2,b,1700));
    at(8400,()=>{say(b1,c,3800);t1.classList.add('laugh');t2.classList.add('laugh')});
    at(10000,()=>{t1.classList.remove('laugh');t2.classList.remove('laugh')});
    at(12500,()=>{t1.classList.add('flip','walk');t1.style.left='-30%'});
    at(15800,()=>{t1.classList.remove('walk','flip');scene()});
  }
  at(700,scene);
  $('#go').onclick=()=>{$('#splash').hidden=true;document.body.classList.remove('splash-on')};
  const LC=['#c2611a','#8c1c2e','#e0a020','#9a4a1a','#d06a2a'];
  $('#leaves').innerHTML=Array.from({length:12},(_,i)=>{const l=Math.random()*100,d=9+Math.random()*10,dl=-Math.random()*d,dx=(Math.random()*160-80).toFixed(0),r=(Math.random()*720-360).toFixed(0);
    return '<svg class="leaf" viewBox="0 0 24 24" style="left:'+l.toFixed(1)+'%;animation-duration:'+d.toFixed(1)+'s;animation-delay:'+dl.toFixed(1)+'s;--dx:'+dx+'px;--r:'+r+'deg"><path d="M12 2c3 4 8 5 8 10a8 8 0 0 1-16 0c0-5 5-6 8-10z" fill="'+LC[i%LC.length]+'"/><path d="M12 6v16" stroke="#5a2a10" stroke-width="1.2"/></svg>'}).join('');
}
}
</script>
